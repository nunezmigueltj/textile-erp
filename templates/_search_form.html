<form method="get" class="row g-3 align-items-center mb-4">
  <!-- Rows per page -->
  <div class="col-md-2 d-flex align-items-center">
    <label for="rowsPerPage" class="form-label me-2 mb-0 text-muted">Rows per page:</label>
    <select id="rowsPerPage" name="rowsPerPage" class="form-select form-select-sm"
            onchange="this.form.submit()">
      <option value="25" {% if rows_per_page == 25 %}selected{% endif %}>25</option>
      <option value="50" {% if rows_per_page == 50 %}selected{% endif %}>50</option>
      <option value="100" {% if rows_per_page == 100 %}selected{% endif %}>100</option>
      <option value="150" {% if rows_per_page == 150 %}selected{% endif %}>150</option>
    </select>
  </div>

  <!-- Search bar -->
  <div class="col-md-8">
    <div class="input-group">
      <span class="input-group-text bg-light border-0">
        <i class="bi bi-search text-muted"></i>
      </span>
      <input type="text" class="form-control" placeholder="Search {{ search_text }}..."
             id="q" name="q" value="{{ request.GET.q }}">
    </div>
  </div>

  <!-- Submit button -->
  <div class="col-md-2 text-end">
    <button class="btn btn-primary px-4" type="submit">
      <i class="bi bi-filter me-1"></i> Apply
    </button>
  </div>
</form>
