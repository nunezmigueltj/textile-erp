<form method="get" class="d-flex justify-content-between align-items-center mb-3">
    <div class="d-flex align-items-center me-3">
        <label for="rowsPerPage" class="form-label me-2">Rows per page:</label>
        <select id="rowsPerPage" name="rowsPerPage" class="form-select d-inline-block w-auto"
            onchange="this.form.submit()">
            <option value="25" {% if rows_per_page == 25 %}selected{% endif %}>25</option>
            <option value="50" {% if rows_per_page == 50 %}selected{% endif %}>50</option>
            <option value="100" {% if rows_per_page == 100 %}selected{% endif %}>100</option>
            <option value="150" {% if rows_per_page == 150 %}selected{% endif %}>150</option>
        </select>
    </div>
    <div class="input-group w-50">
        <input type="text" class="form-control" placeholder="Search information..." id="q" name="q"
            value="{{ request.GET.q }}">
        <button class="btn btn-primary" type="submit">Search</button>
    </div>
</form>
