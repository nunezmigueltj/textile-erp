{% extends "base.html" %}
{% block content %}
<div class="mt-5">
  <div class="card shadow-sm">
    <div class="card-body">
      <form method="post">
        {% csrf_token %}
        <h4 class="mb-3">Edit Vendor</h4>
        
        {% include "companies/_company_form.html" with form=company_form %}   

        <!-- Financial -->
        <div class="mb-4">
          <h6 class="section-header">Financial</h6>
          <div class="mb-3">
            {{ vendor_form.payment_terms.label_tag }}
            {{ vendor_form.payment_terms }}
          </div>
        </div>

        <!-- Actions -->
        <div class="d-flex justify-content-between mt-4">
          <a href="{% url 'companies:companies_list' %}" class="btn btn-secondary">Cancel</a>
          <button type="submit" class="btn btn-success">Save Changes</button>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
