{% extends "base.html" %}
{% block content %}
<div class="mt-5">
  <div class="card shadow-sm">
    <div class="card-body">
      <form method="post">
        {% csrf_token %}
        <h4 class="mb-3">Edit Vendor</h4>
        
        {% include "companies/_company_form.html" with form=company_form %}   

        <!-- Financial -->
        {% include "companies/_vendor_form.html" with vendor_form=vendor_form %}

        <!-- Actions -->
        <div class="d-flex justify-content-between mt-4">
          <a href="{% url 'companies:companies_list' %}" class="btn btn-secondary">Cancel</a>
          <button type="submit" class="btn btn-success">Save Changes</button>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
