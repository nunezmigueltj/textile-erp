{% extends "base.html" %}
{% block content %}
<div class="mt-5">
  <div class="card shadow-sm">
    <div class="card-body">
      <h4 class="mb-4">Customer: {{ company.name }}</h4>
      <form method="post">
        {% csrf_token %}
        
        <!-- Credit Limit -->
        {% include 'companies/_customer_form.html' with customer_form=form %}

        <!-- Actions -->
        <div class="d-flex justify-content-between mt-4">
          <a href="{% url 'companies:companies_list' %}" class="btn btn-secondary">Cancel</a>
          <button type="submit" class="btn btn-success">Add Customer</button>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
