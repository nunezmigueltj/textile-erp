{% extends "base.html" %}
{% block content %}
<div class="mt-5">
  <div class="card shadow-sm">
    <div class="card-body text-center">
      <h4 class="mb-4">Choose Company Role</h4>
      <p class="text-muted mb-4">
        <strong>{{ company.name }}</strong> has been added successfully.  
        What would you like to do next?
      </p>


      <div class="row justify-content-center mb-4">
        <!-- Vendor Card -->
        <div class="col-md-3">
          <div class="card h-100 shadow-sm">
            <div class="card-body text-center">
              <i class="bi bi-truck fs-1 text-primary"></i>
              <h5 class="mt-3">Vendor</h5>
              <a href="{% url 'companies:add_vendor' company.id %}" 
                 class="btn btn-primary mt-3 w-100">Select</a>
            </div>
          </div>
        </div>

        <!-- Customer Card -->
        <div class="col-md-3">
          <div class="card h-100 shadow-sm">
            <div class="card-body text-center">
              <i class="bi bi-person-check fs-1 text-info"></i>
              <h5 class="mt-3">Customer</h5>
              <a href="{% url 'companies:add_customer' company.id %}" 
                 class="btn btn-info mt-3 w-100">Select</a>
            </div>
          </div>
        </div>
      </div>

      <!-- Secondary Options -->
      <div class="row justify-content-center">
        <div class="col-md-3">
          <div class="card h-100 shadow-sm">
            <div class="card-body text-center">
              <i class="bi bi-list-check fs-1 text-secondary"></i>
              <h5 class="mt-3">Companies List</h5>
              <a href="{% url 'companies:companies_list' %}" class="btn btn-secondary mt-3 w-100">Go</a>
            </div>
          </div>
        </div>

        <div class="col-md-3">
          <div class="card h-100 shadow-sm">
            <div class="card-body text-center">
              <i class="bi bi-plus-circle fs-1 text-success"></i>
              <h5 class="mt-3">Add Another</h5>
              <a href="{% url 'companies:add_company' %}" class="btn btn-success mt-3 w-100">Add</a>
            </div>
          </div>
        </div>
      </div>

    </div>
  </div>
</div>
{% endblock %}
