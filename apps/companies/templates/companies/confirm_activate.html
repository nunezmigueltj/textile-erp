{% extends "base.html" %}
{% block content %}
<div class="container mt-5">
  <div class="card shadow-sm">
    <div class="card-body text-center">
      <h3 class="fw-bold text-success">Activate Company</h3>
      <p class="mt-3">
        Are you sure you want to mark <strong>{{ company.name }}</strong> as active?
      </p>
      <p class="text-muted">
        This company will appear in active lists.
      </p>

      <form method="post">
        {% csrf_token %}
        <div class="d-flex justify-content-between mt-4">
          <a href="{% url 'companies:companies_list' %}" class="btn btn-secondary">Cancel</a>
          <button type="submit" class="btn btn-success">Yes, Activate</button>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
