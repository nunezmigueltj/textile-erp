{% extends "base.html" %}
{% block content %}
<div class="mt-5">
  <div class="card shadow-sm">
    <div class="card-body">
      <h4 class="mb-4">Vendor: {{ company.name }}</h4>
      <form method="post">
        {% csrf_token %}
        {% include "companies/_vendor_form.html" with vendor_form=form %}    
        <!-- Actions -->
        <div class="d-flex justify-content-between mt-4">
          <a href="{% url 'companies:companies_list' %}" class="btn btn-secondary">Cancel</a>
          <button type="submit" class="btn btn-success">Save</button>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
