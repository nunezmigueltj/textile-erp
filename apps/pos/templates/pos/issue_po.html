{% extends 'base.html' %}

{% block title %}
Issue PO Page
{% endblock %}

{% block content %}
<div class="mt-5">
  <div class="card shadow-sm">
    <div class="card-body">
      <form method="post">
        {% csrf_token %}
        {% include 'pos/_pos_form.html' %}
        <!-- Actions -->
        <div class="d-flex justify-content-between mt-4">
          <a href="{% url 'pos:pos_list' %}" class="btn btn-secondary">Cancel</a>
          <button type="submit" class="btn btn-add">Issue PO</button>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
