{% extends "base.html" %}
{% block content %}
<div class="container mt-5">
  <div class="card shadow-sm">
    <div class="card-body text-center">
      <h3 class="fw-bold text-success">Re-Open PO</h3>
      <p class="mt-3">
        Are you sure you want to re-open <strong>{{ po }}</strong>?
      </p>
      <p class="text-muted">
        This PO will appear in open lists.
      </p>

      <form method="post">
        {% csrf_token %}
        <div class="d-flex justify-content-between mt-4">
          <a href="{% url 'pos:pos_list' %}" class="btn btn-secondary">Cancel</a>
          <button type="submit" class="btn btn-success">Yes, Re-Open</button>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
