{% extends 'base.html' %}

{% block title %}
Fabrics Home Page
{% endblock %}

{% block content %}
<h1>Fabrics Home Page</h1>
<div class="card-header d-flex justify-content-between align-items-center">
  <span>Active Fabrics</span>
  <button class="btn btn-primary btn-sm btn-add" data-bs-toggle="modal" data-bs-target="#addFabricModal">
    + Add Fabric
  </button>
</div>
{% if fabrics %}
    {% for fabric in fabrics %}
        <p>{{ fabric }}</p>
    {% endfor %}
{% endif %}
{% endblock %}
