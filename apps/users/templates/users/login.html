<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Textile ERP - Login</title>
  <meta name="viewport" content="width=device-width, initial-scale=1"> <!-- important for mobile -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      margin: 0;
      font-family: 'Inter', sans-serif;
      background-color: #f8f9fa;
    }
    .split-container {
      display: flex;
      min-height: 100vh;
    }
    .left-panel {
      flex: 1;
      background: linear-gradient(135deg, #0a2342, #23295f);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      background-size: cover;
      padding: 2rem;
    }
    .login-card {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }
    .card {
      width: 100%;
      max-width: 380px;
      padding: 2rem;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.1);
      background-color: #fff;
    }
    .btn-primary {
      background-color: #23295f;
      border: none;
    }
    .btn-primary:hover,
    .btn-primary:active,
    .btn-primary:focus {
      background-color: #303671 !important;
    }

    /* Responsive behavior */
    @media (max-width: 768px) {
      .split-container {
        flex-direction: column; /* stack panels vertically */
      }
      .left-panel {
        flex: none;
        height: 200px; /* smaller banner on mobile */
        justify-content: center;
        text-align: center;
      }
      .login-card {
        flex: none;
        padding: 1rem;
      }
    }
  </style>
</head>
<body>
  <div class="split-container">
    <div class="left-panel">
      <h1>TEXTILE ERP</h1>
    </div>
    <div class="login-card">
      <div class="card">
        <h3 class="text-center mb-4">Welcome</h3>
        <form method="post">
          {% csrf_token %}
          <div class="mb-3">
            <label for="email" class="form-label">Email</label>
            <input type="email" class="form-control" id="email" name="email" required>
          </div>
          <div class="mb-5">
            <label for="password" class="form-label">Password</label>
            <div class="input-group">
              <input type="password" class="form-control" id="password" name="password" required>
              <button class="btn btn-outline-secondary" type="button" onclick="togglePassword()">👁</button>
            </div>
          </div>
          <button type="submit" class="btn btn-primary w-100">Login</button>
        </form>
      </div>
    </div>
  </div>

  <script>
    function togglePassword() {
      const input = document.getElementById("password");
      input.type = input.type === "password" ? "text" : "password";
    }
  </script>
</body>
</html>
