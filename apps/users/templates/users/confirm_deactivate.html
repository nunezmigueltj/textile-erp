{% extends "base.html" %}
{% block content %}
<div class="container mt-5">
  <div class="card shadow-sm">
    <div class="card-body text-center">
      <h3 class="fw-bold text-danger">Deactivate User</h3>
      <p class="mt-3">
        Are you sure you want to mark <strong>{{ user.email }}</strong> as inactive?
      </p>

      <form method="post">
        {% csrf_token %}
        <div class="d-flex justify-content-between mt-4">
          <a href="{% url 'users:users_list' %}" class="btn btn-secondary">Cancel</a>
          <button type="submit" class="btn btn-delete">Yes, Deactivate</button>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
