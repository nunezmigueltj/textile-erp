<div class="table-responsive">
  {% if inactive_colors %}
  <table class="table table-striped table-hover">
    <thead>
      <tr>
        <th scope="col">Code</th>
        <th scope="col">Name</th>
        <th scope="col">Hex</th>
        <th class="text-end">Actions</th>
      </tr>
    </thead>
    <tbody class="table-group-divider">
      {% for color in inactive_colors %}
      <tr>
        <td>{{ color.code }}</td>
        <td>{{ color.name }}</td>
        <td><span class="d-inline-block rounded-circle border" style="width:15px; height:15px; background-color: {{ color.hex_value }};"></span>
          {{ color.hex_value }}</td>
        <td class="text-end">
          <a href="{% url 'colors:edit_color' color.id %}" class="btn btn-sm btn-edit">Edit</a>
          <a href="{% url 'colors:activate_color' color.id %}" class="btn btn-sm btn-success">Reactivate</a>
        </td>
      </tr>
      {% endfor %}
    </tbody>
  </table>
  {% else %}
  <p class="text-muted">No inactive colors yet.</p>
  {% endif %}

</div>
