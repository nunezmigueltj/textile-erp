<div class="table-responsive">
  <table class="table table-striped table-hover">
    <thead>
      <tr>
        <th scope="col">Code</th>
        <th scope="col">Name</th>
        <th scope="col">Hex</th>
        <th class="text-end">Actions</th>
      </tr>
    </thead>
    <tbody class="table-group-divider">
      {% for color in inactive_colors %}
      <tr>
        <td>{{ color.code }}</td>
        <td>{{ color.name }}</td>
        <td>{{ color.hex_value }}</td>
        <td class="text-end">
          <a href="{% url 'colors:edit_color' color.id %}"
              class="btn btn-sm btn-edit">Edit</a>
          <a href="{% url 'colors:activate_color' color.id %}"
              class="btn btn-sm btn-success">Reactivate</a>
        </td>
      </tr>
      {% endfor %}
    </tbody>
  </table>
</div>
